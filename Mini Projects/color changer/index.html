<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Color Changer</h1>
    <div class="box">
      <button class="random">Random gradient</button>
      <input
        type="text"
        name="color"
        id="input"
        placeholder="Enter a color or hex (e.g red or #f0)"
      />
      <button class="applycolor">Apply Color</button>
    </div>
    <div class="remove">
      <span class="currentColor"
        >Current Color:
        <p class="currentColorValue">white</p>
      </span>
    </div>
    <script src="script.js"></script>
  </body>
</html>
